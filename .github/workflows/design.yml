name: Design

on:
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
        working-directory: design
    steps:
      - uses: actions/checkout@v7
      - run: shasum -a 256 --check --quiet checksums.txt
      - run: diff <(sed 's/^[0-9a-f]*  //' checksums.txt | sort) <(find . -type f ! -name checksums.txt | sort)
      - uses: actions/setup-go@v7
        with:
          go-version-file: design/.check/.go-version
          cache: false
      - run: sh .check/check.sh "$GITHUB_WORKSPACE"
